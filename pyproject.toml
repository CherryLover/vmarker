[project]
name = "vmarker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.10",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mcp>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "python-multipart>=0.0.34",
    "ruff>=0.17.6",
]
