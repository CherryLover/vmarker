# ============================================================================
#  CI/CD：测试（与本地 scripts/ci.sh 相同）→ main 分支构建并推送公开镜像到 GHCR
#        → 经 Tailscale 临时节点 SSH 到 docker-test，上线刚测过的那个 :sha
#  服务器端钥匙被 command= 锁死在 /opt/deploy/deploy.sh：只能「上线某服务的某个 sha」，
#  健康检查不过会自动回滚并让本 job 失败。
# ============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: SKIP_DOCKER=1 ./scripts/ci.sh

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/cherrylover/vmarker:latest
            ghcr.io/cherrylover/vmarker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vmarker
      cancel-in-progress: false
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: 上线到 docker-test
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy && printf '%s\n' "$KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -n -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 \
              root@100.83.147.43 "vmarker ${{ github.sha }}"
