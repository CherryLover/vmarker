# ============================================================================
#  CI/CD：测试（与本地 scripts/ci.sh 相同）→ main 分支构建并推送公开镜像到 GHCR
#  服务器端拉取 ghcr.io/cherrylover/vmarker:latest 即可，不需要登录。
# ============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: SKIP_DOCKER=1 ./scripts/ci.sh

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/cherrylover/vmarker:latest
            ghcr.io/cherrylover/vmarker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
